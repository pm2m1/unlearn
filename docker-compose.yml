services:
  falkordb:
    # Pinned: last 4.x patch older than two weeks. 6.0.x (new Rust engine) avoided per SPEC risks.
    image: falkordb/falkordb:v4.20.7
    environment:
      - REDIS_ARGS=--requirepass ${FALKOR_PASSWORD}
    volumes:
      - falkor-data:/var/lib/falkordb/data
    # Local dev only: seed scripts run on the host. Bound to loopback, never public.
    ports:
      - "127.0.0.1:${FALKOR_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${FALKOR_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  falkor-data:
